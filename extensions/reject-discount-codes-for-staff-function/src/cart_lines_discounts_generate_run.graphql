query CartInput {
  cart {
    buyerIdentity {
      customer {
        isStaff: hasAnyTag(tags: ["Honey Birdette Staff"])
      }
    }
    lines {
      merchandise {
        ... on ProductVariant {
          product {
            title
            stopStaffDiscount: hasAnyTag(tags: ["stop-staff-discount-code"])
          }
        }
      }
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }
}
