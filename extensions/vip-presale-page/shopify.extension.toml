# VIP Presale - Customer Account full-page extension
# A standalone "VIP Presale" account page for the BFCM VIP presale, linked from
# the customer account menu (Content > Menus > customer account menu > Add menu
# item > Apps > VIP Presale).
#
# Shows the products in the collection set at /app/vip-presale (shop metafield
# $app.vip_presale), priced with that page's percent off. The real discount is
# an automatic discount; this page only displays it. Quick add links to the
# storefront's /cart/add. VIP-only gating is not built yet.
api_version = "2026-10"

[[extensions]]
name = "VIP Presale"
handle = "vip-presale-page"
uid = "3e751406-32d5-d357-4dea-47e8d51b6ec5fc7e23271ab3"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/VipPresalePage.tsx"
target = "customer-account.page.render"

[extensions.capabilities]
# api_access: lets the extension query the Storefront API for the products.
api_access = true
